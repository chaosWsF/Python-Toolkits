name: FFmpeg Management

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *" # Monthly on the 1st at 00:00 UTC

jobs:
  submit-dependencies:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Read FFmpeg version
        id: ffmpeg_version
        shell: bash # Force Bash on all OSes
        run: |
          VERSION=$(cat ffmpeg_version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Submit FFmpeg dependency snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dependency-graph/snapshots \
            -d '{
              "version": "0.1",
              "job": {"correlator": "ffmpeg-submit"},
              "sha": "${{ github.sha }}",
              "dependencies": [
                {
                  "package_url": "pkg:generic/ffmpeg@${{ env.VERSION }}",
                  "relationship": "direct",
                  "scope": "runtime"
                }
              ]
            }'

  check-ffmpeg-version:
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Read required FFmpeg version
        shell: bash
        id: required_version
        run: |
          REQUIRED=$(cat ffmpeg_version.txt)
          echo "REQUIRED=$REQUIRED" >> $GITHUB_ENV
      - name: Check FFmpeg version (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          LATEST=$(brew info ffmpeg | grep -o 'stable [0-9.]*' | awk '{print $2}')
          echo "Latest FFmpeg (Homebrew): $LATEST"
          echo "LATEST=$LATEST" >> $GITHUB_ENV
      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          winget install -e --id Gyan.FFmpeg --silent
      - name: Check FFmpeg version (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $INSTALLED = (ffmpeg -version | Select-Object -First 1).Split()[2]
          echo "INSTALLED=$INSTALLED" >> $env:GITHUB_ENV
          echo "Installed FFmpeg version (winget): $INSTALLED"
          echo "Required FFmpeg version: ${{ env.REQUIRED }}"
      - name: Create issue if outdated
        if: env.LATEST > env.REQUIRED
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "FFmpeg version outdated"
          content-filepath: .github/ISSUE_TEMPLATE/ffmpeg_update_template.md
          labels: "dependencies, ffmpeg"
